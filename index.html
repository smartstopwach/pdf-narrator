<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free PDF Story Narrator</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- PDF.js for reading PDF files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Tesseract.js for High Accuracy OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <!-- Dynamic 3D Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="container glass-panel">
        <h1 class="dynamic-title">PDF Story Narrator 🎧</h1>
        <p class="subtitle">Apni PDF upload karein aur 10 parts mein story sunein - Bilkul Free!</p>
        
        <div id="settings-section" class="settings-card">
            <label for="ocr-mode">⚙️ Extraction Mode (OCR):</label>
            <select id="ocr-mode">
                <option value="high-acc" selected>High Accuracy OCR (Best for Hindi - Slower)</option>
                <option value="fast">Fast Text Mode (May corrupt some fonts)</option>
            </select>
        </div>

        <div id="resume-section" class="hidden">
            <h3>Pichli Kahani Bachi Hai! 📖</h3>
            <p>Aapne pichli baar <strong id="saved-file-name"></strong> padhna shuru kiya tha.</p>
            <div class="buttons" style="margin-top: 15px;">
                <button id="resume-btn" class="btn-play">▶ Resume Karein</button>
                <button id="clear-btn" class="btn-stop">Nayi PDF Daalein</button>
            </div>
        </div>

        <div class="upload-section">
            <label for="pdf-upload" class="custom-file-upload">
                📄 PDF File Chunein
            </label>
            <input type="file" id="pdf-upload" accept="application/pdf" />
        </div>
        
        <div id="loading" class="hidden">
            <div class="progress-container">
                <div class="spinner"></div>
                <div class="progress-info">
                    <h3 id="loading-title">Processing PDF...</h3>
                    <p id="loading-text">Kripya prateeksha karein</p>
                    
                    <!-- Progress Bar (New) -->
                    <div class="progress-track hidden" id="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <p class="progress-percentage hidden" id="progress-percentage">0%</p>
                </div>
            </div>
        </div>

        <div id="controls" class="hidden">
            <div class="voice-selection">
                <label for="voice-select">Awaaz (Voice) chunein:</label>
                <select id="voice-select"></select>
            </div>
            <div class="buttons">
                <button id="play-btn" class="btn-play">▶ Play / Resume</button>
                <button id="pause-btn" class="btn-pause">⏸ Pause</button>
                <button id="stop-btn" class="btn-stop">⏹ Stop</button>
            </div>
        </div>

        <div id="parts-container"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
